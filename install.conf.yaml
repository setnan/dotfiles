- defaults:
    link:
      relink: true
      create: true

- clean: ['~', '~/.config']

- shell:
  - description: Installing submodules
    command: "[ -d .git ] && git submodule update --init --recursive || true"
  - description: Fetch zgenom if missing
    command: "[ -f zgenom/zgenom.zsh ] || git clone https://github.com/jandamm/zgenom.git zgenom"

- link:
    ~/.zgenom: zgenom
    ~/.zshenv: zshenv.zsh
    ~/.config/zsh: zsh
    ~/.config/zsh/.zshrc: zsh/zshrc.zsh
    ~/.gitconfig: gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.editorconfig: editorconfig
    ~/.config/starship.toml: starship.toml
    ~/.config/micro/settings.json: micro/settings.json
    ~/.config/micro/bindings.json: micro/bindings.json
    ~/.config/zed/settings.json: zed/settings.json
    ~/Library/Application Support/Sublime Text/Packages/User/Preferences.sublime-settings:
      path: sublime/Preferences.sublime-settings
      force: true
    ~/Library/Application Support/Sublime Text/Packages/Catppuccin: sublime/Catppuccin
    ~/Library/Application Support/Sublime Text/Packages/User/Catppuccin Mocha.sublime-color-scheme: sublime/User/Catppuccin Mocha.sublime-color-scheme
    ~/Library/Application Support/Sublime Text/Packages/User/Catppuccin Latte.sublime-color-scheme: sublime/User/Catppuccin Latte.sublime-color-scheme
    ~/Library/Application Support/Sublime Text/Packages/User/txt_as_markdown.py: sublime/User/txt_as_markdown.py
    ~/.tmux.conf: tmux.conf
    ~/bin: bin
    ~/Library/LaunchAgents/dev.etnan.claude-rc.plist: launchd/dev.etnan.claude-rc.plist
    ~/Library/LaunchAgents/dev.etnan.airthings-ble.plist: launchd/dev.etnan.airthings-ble.plist
    ~/Library/LaunchAgents/dev.etnan.vault-backup.plist: launchd/dev.etnan.vault-backup.plist
    ~/Library/LaunchAgents/dev.etnan.dash-selection-css.plist: launchd/dev.etnan.dash-selection-css.plist
